name: Checks

# Reusable: called by both ci.yml (pull requests, no deploy) and
# deploy.yml (main, gates the build) so the check/test steps live in one
# place instead of being duplicated across the two triggers.
on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test
